<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN1 CLASS | ניהול</title><style>body{font-family:Arial,sans-serif;background:#10172e;color:#f2f5ff;max-width:900px;margin:auto;padding:30px}input,button{padding:12px;border-radius:9px;margin:6px}input{background:#202e50;color:white;border:1px solid #506080}button{background:#6178ef;color:white;border:0;cursor:pointer}.card{background:#1c2947;border-radius:14px;padding:20px;margin:15px 0}a{color:#a9cfff}p{line-height:1.6}</style></head><body><a href="./classroom.html">← חזרה לאתר</a><h1>ניהול GEN1 CLASS</h1><p>ממשק ניהול. הכניסה תופעל רק לאחר חיבור שרת מאובטח.</p><section id="login"><form id="loginForm"><label>שם משתמש <input id="username" autocomplete="username" required></label><label>סיסמה <input id="password" type="password" autocomplete="current-password" required></label><button>כניסה</button></form></section><p id="message" role="status"></p><section id="dashboard" hidden><h2>בקשות הממתינות לאישור</h2><div id="pending"></div><h2>פרויקטים שפורסמו</h2><div id="published"></div><button id="logout">התנתקות</button></section><script src="./config.js"></script><script>
const api=window.GEN1_API_URL||'',message=document.getElementById('message');let token='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,options={}){const r=await fetch(api+path,{...options,headers:{...options.headers,Authorization:'Bearer '+token}});const x=await r.json();if(!r.ok)throw Error(x.error||'פעולה נכשלה');return x}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();if(!api){message.textContent='יש לחבר שרת ניהול מאובטח לפני התחברות.';return}try{const r=await fetch(api+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const x=await r.json();if(!r.ok)throw Error(x.error||'פרטי התחברות שגויים');token=x.token;document.getElementById('password').value='';document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;await load()}catch(e){message.textContent=e.message}};
async function load(){try{const [pending,published]=await Promise.all([req('/admin/submissions'),req('/admin/projects')]);document.getElementById('pending').innerHTML=pending.map(p=>'<div class="card"><strong>'+esc(p.title)+'</strong><p>'+esc(p.student)+' · '+esc(p.nickname)+'</p><button data-id="'+esc(p.id)+'" data-action="approve">אישור</button><button data-id="'+esc(p.id)+'" data-action="reject">דחייה</button></div>').join('')||'<p>אין בקשות ממתינות.</p>';document.getElementById('published').innerHTML=published.map(p=>'<div class="card"><strong>'+esc(p.title)+'</strong><p>'+esc(p.nickname)+'</p><button data-id="'+esc(p.id)+'" data-action="rename">עריכת שם</button><button data-id="'+esc(p.id)+'" data-action="delete">מחיקה</button></div>').join('')||'<p>אין פרויקטים.</p>'}catch(e){message.textContent=e.message}}
document.getElementById('dashboard').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;let body={};if(action==='rename'){const title=prompt('שם חדש לפרויקט');if(!title)return;body={title}}if(action==='delete'&&!confirm('למחוק את הפרויקט?'))return;try{await req('/admin/projects/'+encodeURIComponent(id)+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await load()}catch(e){message.textContent=e.message}};
document.getElementById('logout').onclick=()=>{token='';document.getElementById('dashboard').hidden=true;document.getElementById('login').hidden=false};
</script></body></html>
